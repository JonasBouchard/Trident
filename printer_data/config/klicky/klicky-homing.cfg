
[homing_override]
axes: xyz
gcode:
  {% set stepper_x = printer.configfile.config["stepper_x"] %}
  {% set min_x = printer.configfile.config["stepper_x"]["position_min"]|float %}
  {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
  {% set center_x = (min_x + max_x) / 2 %}
  {% set min_y = printer.configfile.config["stepper_y"]["position_min"]|float %}
  {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
  {% set center_y = (min_y + max_y) / 2 %}
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% set keep_probe = params.KEEP_PROBE|default(0)|int %}

  {% if home_all %}
    G90 ; absolute mode
    # G28 Z
    SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
    G0 Z5 F1000
    #G0 Z1.0 F600
  {% endif %}

  {% if home_all or 'Y' in params %}
    G90 ; absolute mode
    {% if "x" in printer.toolhead.homed_axes %}
      G0 X{center_x} F5000
    {% endif %}
    G28 Y
    G91 ; relative mode
    G0 Y-100 F5000 ; retract 100mm
    G90 ; absolute mode
  {% endif %}

  {% if home_all or 'X' in params %}
    G90 ; absolute mode
    {% if home_all or 'Y' in params or "y" in printer.toolhead.homed_axes %}
      G0 Y{center_y} F5000
    {% endif %}
    G28 X
    G91 ; relative mode
    G0 X-2 F5000 ; retract 2mm
    G90 ; absolute mode
  {% endif %}

  {% if home_all or 'Z' in params %}
    {% set random_x = (range(-10, 10) | random) / 10 %}
    {% set random_y = (range(-10, 10) | random) / 10 %}

    G90 ; absolute mode
    Attach_probe
    {% if 'R' in params %}
      G0 X{150+random_x} Y{285+random_y} F12000
    {% else %}
      G0 X{150+random_x} Y{150+random_y} F12000
    {% endif %}
    G28 Z
    {% if 'R' in params %}
      G0 Z200 F12000
    {% endif %}
    {% if keep_probe %}
      _KLICKY_KEEP_PROBE_CLEARANCE
    {% else %}
      Dock_probe
    {% endif %}
  {% endif %}

[gcode_macro Z_TILT_ADJUST]
rename_existing: _Z_TILT_ADJUST
description:
gcode:
    {% set keep_probe = params.KEEP_PROBE|default(0)|int %}
    {% set V = printer["gcode_macro _User_Variables"].verbose %}
    {% if V %}
        { action_respond_info("Z Tilt Adjust") }
    {% endif %}

    _CheckProbe action=query
    G90
    Attach_Probe
    _KLICKY_STATUS_LEVELING

    _Z_TILT_ADJUST HORIZONTAL_MOVE_Z=20 {% for p in params if p != 'KEEP_PROBE' %}{p}={params[p]} {% endfor %}
    G28 Z KEEP_PROBE={keep_probe}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE
description: Perform Mesh Bed Leveling with klicky automount
gcode:
    {% set keep_probe = params.KEEP_PROBE|default(0)|int %}
    {% set V = printer["gcode_macro _User_Variables"].verbose %}
    {% if V %}
        { action_respond_info("Bed Mesh Calibrate") }
    {% endif %}

    _CheckProbe action=query
    G90
    Attach_Probe
    _KLICKY_STATUS_MESHING

    _BED_MESH_CALIBRATE {% for p in params if p != 'KEEP_PROBE' %}{p}={params[p]} {% endfor %}
    {% if keep_probe %}
      _KLICKY_KEEP_PROBE_CLEARANCE
    {% else %}
      Dock_Probe
    {% endif %}

[gcode_macro RECOVER]
gcode:
      G28 R
# KEEP_PROBE leaves the switch clear for the next probing operation.
[gcode_macro _KLICKY_KEEP_PROBE_CLEARANCE]
description: Clear and verify the attached probe between probing operations
gcode:
    {% set safe_z = printer["gcode_macro _User_Variables"].safe_z|float %}
    {% set lift_feedrate = printer["gcode_macro _User_Variables"].z_drop_speed|float * 60 %}
    {% if printer.gcode_move.gcode_position.z < safe_z %}
      G90
      G0 Z{safe_z} F{lift_feedrate}
    {% endif %}
    M400
    _CheckProbe action=attach
